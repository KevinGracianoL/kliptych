name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Todo comando uv debe fallar si el lockfile quedó desactualizado.
  UV_LOCKED: "1"

jobs:
  gate:
    name: lint + type + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Test-Ffmpeg {
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
            return [bool](Get-Command ffmpeg -ErrorAction SilentlyContinue)
          }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg --no-progress -y
            if (Test-Ffmpeg) { exit 0 }
            Write-Host "choco intento $attempt no dejó ffmpeg; reintentando en 15 s"
            Start-Sleep -Seconds 15
          }
          winget install --id Gyan.FFmpeg -e --disable-interactivity --accept-source-agreements --accept-package-agreements
          if (Test-Ffmpeg) { exit 0 }
          Write-Host "::error::ffmpeg no quedó instalado en Windows"
          exit 1

      - name: Install yt-dlp
        shell: bash
        run: |
          uv tool install "yt-dlp==2026.8.19"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run basedpyright

      - name: Tests
        run: uv run pytest

      - name: Integration tests must not skip
        shell: bash
        run: |
          set -o pipefail
          # faster-whisper (extra transcription) y mediapipe (extra reframe) no
          # se instalan en CI; excluir sus integraciones del gate.
          uv run pytest -m integration -q --no-cov \
            --ignore=tests/test_transcribe_integration.py \
            --ignore=tests/test_reframe_integration.py | tee integration.log
          if grep -q "skipped" integration.log; then
            echo "::error::Los tests de integración se saltaron en CI"
            exit 1
          fi
