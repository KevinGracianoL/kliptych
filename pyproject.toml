[project]
name = "kliptych"
version = "0.1.0"
description = "Pipeline headless que convierte briefs de campaña en paquetes de entrega validados por un gate fail-closed."
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
authors = [{ name = "Kevin Graciano" }]
dependencies = ["pydantic>=2.11,<3", "pypdf>=5,<7"]

[project.optional-dependencies]
# Herramientas pesadas de descarga/transcripción, fuera de las dependencias
# base para mantener mínimo el runtime. yt-dlp también se instala como
# binario en CI.
transcription = ["yt-dlp>=2025.1.1", "faster-whisper>=1.1,<2"]
# Detección de caras para el reframe 9:16. MediaPipe corre en CPU (Tasks API,
# delegate CPU) para no ocupar VRAM; se mantiene fuera del runtime base.
reframe = ["mediapipe>=0.10.35,<1"]

[project.scripts]
kliptych = "kliptych.__main__:main"

[dependency-groups]
dev = [
    "basedpyright>=1.29",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kliptych"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
# Ignorados por conflicto real con el formatter o por no aplicar a un repo privado.
ignore = [
    "missing-trailing-comma",             # conflicto con ruff format
    "single-line-implicit-string-concatenation", # conflicto con ruff format
    "incorrect-blank-line-before-class",  # conflicto con D211
    "multi-line-summary-second-line",     # conflicto con D212
    "missing-copyright-notice",           # la licencia vive en pyproject, sin boilerplate
]

[tool.ruff.lint.per-file-ignores]
"src/kliptych/__main__.py" = [
    "print", # la CLI imprime JSON y ayuda en stdout
]
"src/kliptych/assets.py" = [
    "builtin-argument-shadowing", # el dominio usa `license`, nombre del campo del contrato
]
"src/kliptych/assembler.py" = [
    # ffmpeg se invoca con lista de argumentos y shell=False; el binario es
    # configuración del operador, nunca texto del LLM.
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
    "start-process-with-partial-path",
]
"src/kliptych/environment.py" = [
    # herramientas del sistema invocadas con lista de argumentos y shell=False
    "suspicious-subprocess-import",
    "subprocess-without-shell-equals-true",
]
"src/kliptych/moments.py" = [
    # ffmpeg se invoca con lista de argumentos y shell=False; el binario es
    # configuración del operador, nunca texto del LLM.
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
    "start-process-with-partial-path",
    # detect delega en _run_ffmpeg, que lanza MomentDetectionError; la sección
    # Raises documenta el contrato público.
    "docstring-extraneous-exception",
]
"src/kliptych/segment.py" = [
    # build_prompt delega en _bounds_from, que lanza SegmentSelectionError; la
    # sección Raises documenta el contrato público.
    "docstring-extraneous-exception",
]
"src/kliptych/download.py" = [
    # yt-dlp/streamlink/chat-downloader se invocan con lista de argumentos y
    # shell=False; el binario es configuración del operador, nunca texto del LLM.
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
    "start-process-with-partial-path",
    # download_video/download_stream/download_chat delegan en _run_download, que
    # es quien lanza DownloadError; la sección Raises documenta el contrato.
    "docstring-extraneous-exception",
]
"src/kliptych/gate/models.py" = [
    "hardcoded-password-string", # falso positivo: PASS/FAIL son estados del gate
]
"src/kliptych/gate/probe.py" = [
    # ffprobe se invoca con lista de argumentos y shell=False; el binario es
    # configuración del operador, nunca texto del LLM.
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
    "start-process-with-partial-path",
]
"src/kliptych/ingest.py" = [
    # DOCX local elegido por el operador (nunca entrada del LLM/red): el XML
    # se parsea con la stdlib, sin resolver entidades externas.
    "suspicious-xml-etree-import",
    "suspicious-xml-element-tree-usage",
    # Frontera de parsers externos (pypdf/zipfile): cualquier falla builtin no
    # documentada se traduce de inmediato a IngestError conservando la causa.
    "blind-except",
]
"src/kliptych/pipeline.py" = [
    # run_given_clips delega el ensamblado y la exportación; PipelineError se
    # lanza en el helper _resolved y la sección Raises documenta el contrato.
    "docstring-extraneous-exception",
]
"src/kliptych/runtime/openai_compatible.py" = [
    # extract_contract/write_caption delegan en _complete, que es quien lanza
    # los errores; la sección Raises documenta el contrato público.
    "docstring-extraneous-exception",
]
"src/kliptych/runtime/recorded.py" = [
    # write_caption delega el payload y la validación de plataforma en
    # caption_prompt_payload (vía _caption_key), que lanza ModelInputError; la
    # sección Raises documenta el contrato público.
    "docstring-extraneous-exception",
]
"src/kliptych/runtime/transport.py" = [
    # petición al endpoint configurado por el operador; el esquema http/https
    # se valida antes de construirla y no hay redirecciones.
    "suspicious-url-open-usage",
]
"src/kliptych/transcribe.py" = [
    # faster-whisper y torch son dependencias opcionales (extra transcription):
    # se importan de forma diferida para no cargar el módulo base.
    "import-outside-top-level",
    # Frontera con faster-whisper: cualquier fallo de la librería se traduce a
    # TranscriptionError conservando la causa.
    "blind-except",
]
"src/kliptych/reframe.py" = [
    # ffmpeg/ffprobe se invocan con lista de argumentos y shell=False; el
    # binario es configuración del operador, nunca texto del LLM.
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
    "start-process-with-partial-path",
    # mediapipe/numpy son dependencias opcionales (extra reframe): se importan
    # de forma diferida para no cargar el módulo base ni tocar VRAM.
    "import-outside-top-level",
    # Frontera con mediapipe: cualquier fallo de la librería se traduce a
    # ReframeError conservando la causa.
    "blind-except",
    # analyze/reframe delegan en helpers que lanzan ReframeError; la sección
    # Raises documenta el contrato público.
    "docstring-extraneous-exception",
]
"src/kliptych/subtitles.py" = [
    # ffmpeg se invoca con lista de argumentos y shell=False; el binario es
    # configuración del operador, nunca texto del LLM.
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
    "start-process-with-partial-path",
    # burn delega en _run_ffmpeg, que lanza SubtitleError; la sección Raises
    # documenta el contrato público.
    "docstring-extraneous-exception",
]
"tests/test_assembler.py" = [
    # ffmpeg se invoca con lista de argumentos y shell=False para generar
    # fixtures sintéticos.
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/test_download.py" = [
    # subprocess se usa solo para TimeoutExpired y para el runner real con
    # sys.executable; sin red y con lista de argumentos.
    "suspicious-subprocess-import",
]
"tests/test_moments.py" = [
    # subprocess se usa solo para CompletedProcess/TimeoutExpired con ffmpeg
    # simulado; lista de argumentos y shell=False.
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/test_moments_integration.py" = [
    # ffmpeg se invoca con lista de argumentos y shell=False para generar el
    # fixture sintético local.
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
    "start-process-with-partial-path",
]
"tests/test_download_integration.py" = [
    # ffmpeg se invoca con lista de argumentos y shell=False para generar el
    # clip local; el handler HTTP usa la firma fija de la stdlib.
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
    "start-process-with-partial-path",
    "invalid-function-name",
    "builtin-argument-shadowing",
]
"tests/test_exporter.py" = [
    # mklink se invoca con lista de argumentos y shell=False para crear un junction.
    "subprocess-without-shell-equals-true",
    "start-process-with-partial-path",
    "suspicious-subprocess-import",
]
"tests/test_gate_probe.py" = [
    # ffmpeg se invoca con lista de argumentos y shell=False para generar
    # fixtures sintéticos.
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/test_ingest.py" = [
    # La CLI real se ejecuta en subproceso para verificar que stderr queda
    # limpio (solo JSON) ante fallos del parser.
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
    # user_password/owner_password son parámetros reales de pypdf, no secretos.
    "hardcoded-password-func-arg",
]
"tests/test_main.py" = [
    # El entry point instalado se ejecuta en subproceso para verificar que el
    # comando documentado en el README existe.
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/test_pipeline.py" = [
    # ffmpeg se invoca con lista de argumentos y shell=False para generar
    # el clip sintético de la demo.
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/test_transcribe_integration.py" = [
    # PowerShell se invoca con lista de argumentos y shell=False para
    # sintetizar la voz del fixture; la ruta viaja por variable de entorno.
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
    "start-process-with-partial-path",
]
"tests/test_transport.py" = [
    # firma fija del handler HTTP estándar (do_POST/log_message)
    "invalid-function-name",
    "builtin-argument-shadowing",
]
"tests/test_reframe.py" = [
    # subprocess se usa solo para CompletedProcess/TimeoutExpired/Popen con
    # ffmpeg simulado; lista de argumentos y shell=False.
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/test_subtitles.py" = [
    # subprocess se usa solo para CompletedProcess/TimeoutExpired con ffmpeg
    # simulado; lista de argumentos y shell=False.
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/test_reframe_integration.py" = [
    # ffmpeg se invoca con lista de argumentos y shell=False para generar el
    # fixture sintético y descargar el modelo de caras (integración, fuera de CI).
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
    "start-process-with-partial-path",
    # descarga del modelo BlazeFace desde el bucket público de MediaPipe; es
    # integración (excluida de CI) y se salta si no hay red.
    "suspicious-url-open-usage",
]
"tests/test_subtitles_integration.py" = [
    # ffmpeg se invoca con lista de argumentos y shell=False para generar el
    # fixture sintético y quemar los subtítulos.
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
    "start-process-with-partial-path",
]
"tests/**" = [
    "assert",                       # los tests usan assert por diseño
    "magic-value-comparison",       # los tests comparan contra literales
    "too-many-arguments",           # los builders de fixtures son keyword-only
    "undocumented-public-method",   # sin docstring de método en tests
    "undocumented-public-init",     # sin docstring de __init__ en tests
    "unused-method-argument",       # los fakes ignoran argumentos por diseño
    "undocumented-public-module",   # sin docstring de módulo en tests
    "undocumented-public-class",    # sin docstring de clase en tests
    "undocumented-public-function", # sin docstring de función en tests
    "private-member-access",        # los tests espían el estado interno a propósito
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=kliptych --cov-report=term-missing --cov-fail-under=90"
markers = [
    "integration: requiere herramientas externas (ffmpeg/ffprobe) presentes en la máquina",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.basedpyright]
typeCheckingMode = "all"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
